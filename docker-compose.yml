services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litigation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
      POSTGRES_DB: ${POSTGRES_DB:-litigation}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litigation} -d ${POSTGRES_DB:-litigation}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [litnet]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [litnet]

  # Object storage (S3-compatible). SeaweedFS is used because MinIO's
  # public Docker images were withdrawn (Hub repo deleted 2026-09-11;
  # quay.io requires auth since 2026-09-24). `weed mini` runs
  # master+volume+filer+s3 in one container; S3 API on :8333.
  s3:
    image: chrislusf/seaweedfs:latest
    command: mini -s3.port=8333 -ip.bind=0.0.0.0
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8333/ >/dev/null 2>&1 || curl -fs http://localhost:8333/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [litnet]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litigation}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litigation}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: litigation
      S3_SECRET_KEY: ${S3_SECRET_KEY:-unused}
      S3_BUCKET: ${S3_BUCKET:-litigation-evidence}
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      s3: {condition: service_healthy}
    networks: [litnet]

  worker:
    build: ./worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litigation}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litigation}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: litigation
      S3_SECRET_KEY: ${S3_SECRET_KEY:-unused}
      S3_BUCKET: ${S3_BUCKET:-litigation-evidence}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      s3: {condition: service_healthy}
    networks: [litnet]

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on: [backend]
    networks: [litnet]

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-change-me-now}
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    networks: [litnet]

volumes:
  pgdata:
  s3data:
  n8ndata:

networks:
  litnet:
