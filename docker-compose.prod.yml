services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    networks: [litnet]

  # Prod: don't bind app ports directly; only Caddy faces the network
  backend:
    ports: []
  frontend:
    ports: []

volumes:
  caddy_data:
  caddy_config:
