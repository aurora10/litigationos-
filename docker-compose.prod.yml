# Reverse proxy (Caddy) for production: TLS termination + route to frontend/backend.
# Requires a real domain + DNS pointing at the host.

caddy:
  image: caddy:2-alpine
  restart: unless-stopped
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
  depends_on: [backend, frontend]
  networks: [litnet]

volumes:
  caddy_data:
  caddy_config:
